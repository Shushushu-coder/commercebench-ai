[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commercebench-ai"
version = "0.1.0"
description = "A reproducible benchmark and experimentation platform for evaluating LLM capabilities in commerce customer-service scenarios."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["commercebench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
